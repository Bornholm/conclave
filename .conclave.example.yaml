# Conclave configuration. Copy to .conclave.yaml at the repository root.
version: 1

forge:
  provider: github          # github | gitea | redmine
  remote: origin            # git remote naming the repository holding the pull
                            # requests and issues. A pull request opened from a
                            # fork lives in the upstream repository: contributors
                            # working from a fork point this at their `upstream`
                            # remote, not at `origin`.
  # base_url: https://api.github.com          # GitHub.com (default)
  # base_url: https://ghe.example.com/api/v3  # GitHub Enterprise
  # base_url: https://git.example.com         # Gitea / Forgejo (public instance URL)
  # base_url: https://redmine.example.com   # Redmine (public instance URL)
  token_env: GITHUB_TOKEN   # name of the environment variable holding the token
                            # (GitHub: falls back to `gh auth token` when empty)
                            # (Redmine: set REDMINE_TOKEN)

review:
  max_parallel: 3
  timeout: 30m
  agent_timeout: 15m
  lead_timeout: 15m
  keep_worktrees: false
  fail_fast: false
  include:
    associated_issues: true   # every issue referenced as #N in the description or discussion
    discussion: true          # comments, reviews and inline review comments of the PR
    changed_files: true
    diff: true
  limits:
    max_output_bytes: 1048576
    max_diff_bytes: 5242880
    max_files: 3000
    max_findings: 200
    max_issues: 10            # referenced issues loaded, in order of appearance
    max_comments: 200         # discussion entries kept (the most recent ones)
    max_comment_bytes: 8192   # per comment or issue body

# `conclave triage` reuses the agents above with another prompt: it labels an
# issue and says whether it still describes something true about the code.
triage:
  max_parallel: 3
  # Which reviewers triage. Empty means the first one: deciding whether a
  # ticket still holds rarely needs three opinions the way a diff does.
  reviewers: []
  use_lead: true
  labels:
    source: forge           # forge | list
    # Labels are read from the repository, with their descriptions. Keep the
    # families that are categories, drop process labels.
    include: []             # e.g. ["type/*", "area/*"]
    exclude: ["wontfix", "duplicate", "good first issue"]
    # Fill in or override a label description the forge leaves empty.
    describe: {}
    max_labels: 4
  # Conclave adds these labels itself, from the status, so a status and its
  # label never disagree. The label must exist on the repository.
  status_labels: {}         # e.g. {needs-info: question}
  # `--apply` adds the proposed labels on the forge. It only ever adds, never
  # removes and never closes. An issue triaged below this confidence is left
  # alone: a write to the forge is the one thing a rerun cannot undo.
  min_apply_confidence: 0.6
  limits:
    max_issues: 50
    max_comments: 50
    max_references: 30

# `conclave plan` reuses the same agents again: each one reads the code and
# writes the implementation plan for one issue, and the lead turns them into
# the single plan a developer follows.
plan:
  max_parallel: 3
  # Which reviewers write a plan. Empty means all of them: two designs of the
  # same change are worth comparing, and the lead has to choose one.
  planners: []
  use_lead: true
  limits:
    max_steps: 30           # steps kept per plan
    max_comments: 50        # issue comments given to the agents
    max_references: 30      # commits and pull requests mentioning the issue

output:
  format: markdown          # markdown | json
  show_attribution: true
  show_failed_agents: true

# Every agent receives the prompt (stdin by default), runs inside its own
# disposable worktree checked out at the PR head, and must print one JSON
# object on stdout. Conclave also understands the Claude Code JSON envelope,
# NDJSON streams and ```json fenced blocks.
#
# Each reviewer performs a complete review. Diversity comes from using
# different tools and models, not from splitting topics: `specialties` is
# optional and only adds priority areas to the prompt.
#
# `model` is a label recorded in the report and the run manifest; it does not
# select the model. Pass the tool's own flag for that (--model) so the model
# never depends on which credentials happen to be available.
agents:
  # Claude Code — https://docs.anthropic.com/claude-code
  - id: claude
    role: reviewer
    command:
      - claude
      - --print
      - --output-format
      - json
      - --permission-mode
      - plan
    # model: claude-opus-4-8   # optional label; detected from the JSON envelope otherwise
    environment:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"

  # OpenCode — https://opencode.ai
  - id: opencode
    role: reviewer
    command: [opencode, run, --dir, "{worktree}"]
    # command: [opencode, run, --model, anthropic/claude-opus-4-8]
    input: argument          # opencode reads the message from its arguments

  # Pi — https://github.com/badlogic/pi-mono
  - id: pi
    role: reviewer
    command:
      - pi
      - --print
      - --no-session
      - --mode
      - json                  # event stream: Conclave keeps the tool trace and detects the model
      - --tools
      - read,grep,find,ls     # read-only tools for reviewers
      # - --model
      # - anthropic/claude-opus-4-8
      - --
    input: argument          # pi reads the message from its arguments
    output: pi-json
    max_output_bytes: 33554432   # the event stream includes every file read

  - id: claude-lead
    role: lead
    command:
      - claude
      - --print
      - --output-format
      - json
      - --permission-mode
      - plan
