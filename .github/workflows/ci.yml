name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race ./...
      # Cross-compile the release targets here, so platform-specific code
      # (process groups, syscall) breaks on the pull request, not on the tag.
      - run: GOOS=windows GOARCH=amd64 go build ./...
      - run: GOOS=windows GOARCH=386 go build ./...
      - run: GOOS=darwin GOARCH=arm64 go build ./...
      - run: GOOS=darwin GOARCH=amd64 go build ./...
      - run: GOOS=linux GOARCH=arm64 go build ./...
      - run: sh -n install.sh

  # The Pi extension is embedded as source and only ever run by Pi: check it
  # against Pi's published types, so a contract change fails here, not in a
  # review stopped at its deadline.
  pi-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: internal/integration/typecheck
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx tsc -p tsconfig.json
