version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: conclave
    # No cgo: every first-class Go target cross-compiles from one runner.
    env:
      - CGO_ENABLED=0
    targets: [go_first_class]
    mod_timestamp: "{{ .CommitTimestamp }}"
    dir: ./cmd/conclave
    binary: conclave
    flags:
      - -trimpath
    ldflags:
      - -w -s -X 'github.com/bornholm/conclave/internal/cli.Version={{ .Version }} ({{ .Commit }})'

archives:
  - id: conclave
    ids: [conclave]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - .conclave.example.yaml

nfpms:
  - id: conclave
    package_name: conclave
    ids: [conclave]
    formats:
      - deb
      - archlinux
    vendor: bornholm
    homepage: https://github.com/bornholm/conclave
    maintainer: William Petit <will.arcanadelirium@gmail.com>
    license: MIT
    description: |-
      Conclave - multi-agent pull request review.
      Runs several local coding agents (Claude Code, OpenCode, Pi) on a
      GitHub or Gitea pull request, each in its own Git worktree, and
      consolidates their reports with a lead agent.
    bindir: /usr/bin
    contents:
      - src: README.md
        dst: /usr/share/doc/conclave/README.md
      - src: .conclave.example.yaml
        dst: /usr/share/doc/conclave/conclave.example.yaml
      - src: LICENSE
        dst: /usr/share/doc/conclave/LICENSE

# A PKGBUILD for the prebuilt archives, pushed to the AUR on each release.
# "conclave" is taken there by an unrelated game, hence conclave-bin only.
# The workflow passes AUR_KEY, the private SSH key of the AUR account, with
# no passphrase; without it nothing is pushed and the PKGBUILD stays in dist.
aurs:
  - name: conclave-bin
    ids: [conclave]
    homepage: https://github.com/bornholm/conclave
    description: Multi-agent pull request review with local coding agents
    maintainers:
      - William Petit <will.arcanadelirium@gmail.com>
    license: MIT
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: ssh://aur@aur.archlinux.org/conclave-bin.git
    skip_upload: '{{ if index .Env "AUR_KEY" }}auto{{ else }}true{{ end }}'
    depends:
      - git
    commit_author:
      name: William Petit
      email: will.arcanadelirium@gmail.com
    package: |-
      install -Dm755 ./conclave "${pkgdir}/usr/bin/conclave"
      install -Dm644 ./LICENSE "${pkgdir}/usr/share/licenses/conclave-bin/LICENSE"
      install -Dm644 ./README.md "${pkgdir}/usr/share/doc/conclave/README.md"
      install -Dm644 ./.conclave.example.yaml "${pkgdir}/usr/share/doc/conclave/conclave.example.yaml"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  name_template: "v{{ .Version }}"
